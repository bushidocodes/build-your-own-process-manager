name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format + strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: clang-format --dry-run --Werror log.c log.h web.c proxy.c
      - name: Strict compile (warnings as errors)
        run: |
          gcc -Wall -Wextra -Werror -std=c11 -pedantic -c log.c   -o /dev/null
          gcc -Wall -Wextra -Werror -std=c11 -pedantic -c web.c   -o /dev/null
          gcc -Wall -Wextra -Werror -std=c11 -pedantic -c proxy.c -o /dev/null

  build:
    name: Build + solution integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build everything (pm, web, proxy)
        run: make build
      - name: Stub runs and prints expected output
        run: |
          OUTPUT=$(./pm)
          [ "$OUTPUT" = "Implement Me!" ] || { echo "Unexpected: $OUTPUT"; exit 1; }
      - name: Encoded solution decodes and compiles
        run: base64 -d solution/main.c.b64 | gcc -x c -Wall -Wextra -o /dev/null -

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make build

      - name: Web server — valid file returns 200, missing returns 404
        run: |
          CHAOS_RATE=0 ./web 8081 &
          WEB_PID=$!
          sleep 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/)
          echo "index.html: HTTP $STATUS"; [ "$STATUS" = "200" ] || exit 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/notfound)
          echo "notfound:   HTTP $STATUS"; [ "$STATUS" = "404" ] || exit 1
          kill $WEB_PID; wait $WEB_PID 2>/dev/null || true

      - name: Proxy — no backends returns 502 within 5s
        run: |
          ./proxy &
          PROXY_PID=$!
          sleep 1
          START=$SECONDS
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1337/)
          ELAPSED=$(( SECONDS - START ))
          echo "HTTP $STATUS in ~${ELAPSED}s"
          [ "$STATUS" = "502" ] || { echo "Expected 502, got $STATUS"; exit 1; }
          [ "$ELAPSED" -lt 5 ]  || { echo "Took too long: ${ELAPSED}s";  exit 1; }
          kill $PROXY_PID 2>/dev/null || true

      - name: Proxy — forwards to a live worker (200) and relays 404
        run: |
          CHAOS_RATE=0 ./web 8081 &
          WEB_PID=$!
          ./proxy &
          PROXY_PID=$!
          sleep 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1337/)
          echo "proxied /:        HTTP $STATUS"; [ "$STATUS" = "200" ] || exit 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1337/notfound)
          echo "proxied /notfound: HTTP $STATUS"; [ "$STATUS" = "404" ] || exit 1
          kill $WEB_PID $PROXY_PID 2>/dev/null || true
